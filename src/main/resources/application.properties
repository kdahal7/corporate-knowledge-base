# Application Configuration
spring.application.name=corporate-knowledge-base
server.port=8080

# PostgreSQL Configuration (Neon with PGVector)
spring.datasource.url=jdbc:postgresql://ep-sweet-shadow-ai0pynn4-pooler.c-4.us-east-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_y6ga5MwYFVSb
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# LLM Provider Selection (local or cloud)
# Use 'ollama' for local development (FREE, no API key)
# Use 'huggingface' for online deployment (FREE tier available)
llm.provider=${LLM_PROVIDER:huggingface}

# Ollama Configuration (Local LLM - for development)
ollama.api.url=http://localhost:11434/api/generate
ollama.model.name=llama3.1:8b

# Hugging Face Configuration (Cloud LLM - for deployment)
# Get free API key from: https://huggingface.co/settings/tokens
# Set HUGGINGFACE_API_KEY environment variable for deployment
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.api.url=https://api-inference.huggingface.co/models
# Using faster model for better free tier performance
huggingface.model.name=google/flan-t5-base
gemini.embedding.model=text-embedding-004

# Vector Configuration
vector.dimension=768
vector.chunk.size=500
vector.chunk.overlap=50

# Logging
logging.level.com.infosys.ai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
