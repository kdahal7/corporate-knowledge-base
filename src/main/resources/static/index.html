<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Corporate Knowledge Base</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-section:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-label {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .query-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .query-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .response-section {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            min-height: 150px;
        }

        .response-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .response-text {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .source-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .source-item h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .source-content {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .documents-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .document-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .document-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .document-meta {
            font-size: 0.85rem;
            color: #666;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #ff4757;
            background: #fff0f0;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .success {
            color: #2ed573;
            background: #f0fff4;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Use current domain for API calls (works on localhost and Render)
        const API_BASE = `${window.location.origin}/api`;

        function App() {
            const [documents, setDocuments] = useState([]);
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [question, setQuestion] = useState('');
            const [response, setResponse] = useState(null);
            const [querying, setQuerying] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);

            useEffect(() => {
                fetchDocuments();
            }, []);

            const fetchDocuments = async () => {
                try {
                    const res = await fetch(`${API_BASE}/documents`);
                    const data = await res.json();
                    if (data.success) {
                        setDocuments(data.data);
                    }
                } catch (err) {
                    console.error('Error fetching documents:', err);
                }
            };

            const handleFileChange = (e) => {
                setSelectedFile(e.target.files[0]);
                setError(null);
                setSuccess(null);
            };

            const handleUpload = async () => {
                if (!selectedFile) {
                    setError('Please select a file');
                    return;
                }

                setUploading(true);
                setError(null);
                setSuccess(null);

                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    const res = await fetch(`${API_BASE}/documents/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setSuccess('Document uploaded and processed successfully!');
                        setSelectedFile(null);
                        fetchDocuments();
                    } else {
                        setError(data.message);
                    }
                } catch (err) {
                    setError('Failed to upload document: ' + err.message);
                } finally {
                    setUploading(false);
                }
            };

            const handleQuery = async () => {
                if (!question.trim()) {
                    setError('Please enter a question');
                    return;
                }

                setQuerying(true);
                setError(null);
                setResponse(null);

                try {
                    const res = await fetch(`${API_BASE}/query`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            question: question,
                            topK: 3
                        })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setResponse(data.data);
                    } else {
                        setError(data.message);
                    }
                } catch (err) {
                    setError('Failed to process query: ' + err.message);
                } finally {
                    setQuerying(false);
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('Are you sure you want to delete this document?')) {
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/documents/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setSuccess('Document deleted successfully');
                        fetchDocuments();
                    } else {
                        setError(data.message);
                    }
                } catch (err) {
                    setError('Failed to delete document: ' + err.message);
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>🧠 AI-Powered Corporate Knowledge Base</h1>
                        <p>RAG-based Enterprise Search with Google Gemini & PGVector</p>
                    </div>

                    <div className="main-content">
                        <div className="card">
                            <h2>📤 Upload Documents</h2>
                            <div className="upload-section" onClick={() => document.getElementById('fileInput').click()}>
                                <input 
                                    id="fileInput"
                                    type="file" 
                                    accept=".pdf"
                                    onChange={handleFileChange}
                                />
                                <label className="upload-label">
                                    {selectedFile ? selectedFile.name : '📄 Click to select a PDF file'}
                                </label>
                            </div>
                            
                            <button 
                                className="btn" 
                                onClick={handleUpload}
                                disabled={!selectedFile || uploading}
                                style={{marginTop: '15px', width: '100%'}}
                            >
                                {uploading ? 'Processing...' : 'Upload & Process'}
                            </button>

                            {success && <div className="success">{success}</div>}
                            {error && <div className="error">{error}</div>}
                        </div>

                        <div className="card">
                            <h2>📚 Documents ({documents.length})</h2>
                            <div className="documents-list">
                                {documents.length === 0 ? (
                                    <p style={{textAlign: 'center', color: '#999'}}>No documents uploaded yet</p>
                                ) : (
                                    documents.map(doc => (
                                        <div key={doc.id} className="document-item">
                                            <div className="document-info">
                                                <h4>{doc.fileName}</h4>
                                                <div className="document-meta">
                                                    {doc.totalChunks} chunks • {(doc.fileSize / 1024).toFixed(2)} KB
                                                </div>
                                            </div>
                                            <button 
                                                className="delete-btn"
                                                onClick={() => handleDelete(doc.id)}
                                            >
                                                Delete
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="card full-width">
                            <h2>💬 Ask Questions</h2>
                            <div className="query-section">
                                <input
                                    type="text"
                                    className="query-input"
                                    placeholder="e.g., What is the sick leave policy?"
                                    value={question}
                                    onChange={(e) => setQuestion(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleQuery()}
                                />
                                <button 
                                    className="btn"
                                    onClick={handleQuery}
                                    disabled={querying}
                                >
                                    {querying ? 'Thinking...' : 'Ask'}
                                </button>
                            </div>

                            {response && (
                                <div className="response-section">
                                    <h3>Answer:</h3>
                                    <div className="response-text">{response.answer}</div>
                                    
                                    {response.sources && response.sources.length > 0 && (
                                        <div className="sources">
                                            <h3>Sources ({response.totalSources}):</h3>
                                            {response.sources.map((source, idx) => (
                                                <div key={idx} className="source-item">
                                                    <h4>📄 {source.documentName} (Chunk {source.chunkIndex + 1})</h4>
                                                    <div className="source-content">
                                                        {source.content.substring(0, 200)}...
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {querying && <div className="loading">Processing your question...</div>}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
